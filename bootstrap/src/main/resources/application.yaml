spring:
  application:
    name: simple-rag

  # 数据库配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/simple_rag
    username: postgres
    password: postgres

  # Redis 配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379

  # Jackson 配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # Spring AI MCP Client 配置（用于联网搜索）
  ai:
    mcp:
      client:
        enabled: true
        name: simple-rag-mcp-client
        version: 1.0.0
        # 首次启动 npx 需要下载 MCP Server 包，超时给宽一些
        request-timeout: 120s
        type: SYNC
        toolcallback:
          enabled: true
        stdio:
          # 注意：这里走 @ConfigurationProperties 绑定，env 值支持 ${VAR} 占位符解析；
          # 不要再用 mcp-servers.json，那条路径是 Jackson 直读，不解析占位符。
          connections:
            tavily-search:
              command: npx
              args:
                - "-y"
                - "tavily-mcp@latest"
              env:
                TAVILY_API_KEY:

# AI 模型配置
ai:
  providers:
    bailian:
      api-key: ${BAILIAN_API_KEY:sk-}
      model: qwen-plus
      base-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    siliconflow:
      api-key: ${SILICONFLOW_API_KEY:sk-}
      model: deepseek-ai/DeepSeek-V3.2
      base-url: https://api.siliconflow.cn/v1
    ollama:
      model: deepseek-r1:1.5b
      base-url: http://localhost:11434

# Embedding 服务配置
embedding:
  provider: siliconflow  # 支持：siliconflow, bailian, ollama
  siliconflow-api-key: ${SILICONFLOW_API_KEY:sk-}
  siliconflow-model: BAAI/bge-large-zh-v1.5
  siliconflow-base-url: https://api.siliconflow.cn/v1/embeddings
  bailian-api-key: ${BAILIAN_API_KEY:sk-}
  bailian-model: text-embedding-v4
  bailian-base-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
  ollama-base-url: http://localhost:11434
  ollama-model: bge-large-zh

# Milvus 向量数据库配置
milvus:
  host: 127.0.0.1
  port: 19530
  vector-dimension: 1024

# RustFS 对象存储配置
rustfs:
  endpoint: http://127.0.0.1:9000
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: simple-rag

# RocketMQ 配置
rocketmq:
  name-server: 127.0.0.1:9876

  producer:
    group: simple-rag-producer
    send-message-timeout: 3000

  consumer-group: simple-rag-consumer  # ← 必填，只能用字母/数字/下划线/中划线
  consumer-tag: '*'                    # 可选，默认 '*'

  chunk-topic: knowledge-chunk-topic

# SA-Token 配置
sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-cookie: false
  is-read-header: true

# 服务器配置
server:
  port: 9092
  servlet:
    context-path: /api/simple-rag

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.nageoffer.ai.simple_rag: DEBUG

# 联网搜索（兜底降级）配置
web-search:
  # 是否允许在 RagService 中触发联网搜索（前端开关 + 此处全局开关共同决定）
  enabled: true
  # 向量检索 top1 分数低于该阈值视为"未找到合适回答"，触发兜底
  score-threshold: 0.02
  # 联网搜索返回的最大结果条数
  top-k: 5
  # MCP Server 暴露的搜索工具名（按优先级匹配，匹配到的第一个会被使用）
  # 常见值：brave_web_search / tavily-search / web_search
  tool-name-keywords:
    - brave_web_search
    - tavily-search
    - web_search
    - search