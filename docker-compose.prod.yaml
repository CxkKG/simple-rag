services:
  # PostgreSQL 数据库
  postgres:
    image: pgvector/pgvector:pg15
    container_name: simple-rag-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-simple_rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./resources/database/schema_pg.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./resources/database/init_data_pg.sql:/docker-entrypoint-initdb.d/02-init-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simple-rag-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: simple-rag-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simple-rag-network

  # Milvus etcd
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    networks:
      - simple-rag-network

  # Milvus MinIO（仅给 Milvus 使用）
  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data
    networks:
      - simple-rag-network

  # Milvus
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: milvus-standalone
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - milvus-minio
    networks:
      - simple-rag-network

  # RustFS 对象存储
  rustfs:
    image: rustfs/rustfs:latest
    container_name: simple-rag-rustfs
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    command: server /data --console-address ":9001"
    networks:
      - simple-rag-network

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx256m"
    networks:
      - simple-rag-network

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: rocketmq-broker
    restart: always
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - rocketmq_data:/home/rocketmq/rocketmq-5.2.0/store
    networks:
      - simple-rag-network

  # Spring Boot 应用
  simple-rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-rag-app
    restart: always
    ports:
      - "9092:9092"
    environment:
      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-simple_rag}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}

      # Redis
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Milvus
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_VECTOR_DIMENSION: ${MILVUS_VECTOR_DIMENSION:-1024}

      # RustFS
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-simple-rag}

      # RocketMQ
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-rocketmq-namesrv:9876}
      ROCKETMQ_PRODUCER_GROUP: ${ROCKETMQ_PRODUCER_GROUP:-simple-rag-producer}
      ROCKETMQ_CONSUMER_GROUP: ${ROCKETMQ_CONSUMER_GROUP:-simple-rag-consumer}
      ROCKETMQ_CHUNK_TOPIC: ${ROCKETMQ_CHUNK_TOPIC:-knowledge-chunk-topic}

      # AI API
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}

      # Embedding
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      EMBEDDING_SILICONFLOW_API_KEY: ${EMBEDDING_SILICONFLOW_API_KEY:-}
      EMBEDDING_BAILIAN_API_KEY: ${EMBEDDING_BAILIAN_API_KEY:-}

      # Reranker
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}

      # Web Search
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}

      # MCP
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # Server
      SERVER_PORT: ${SERVER_PORT:-9092}
      SERVER_CONTEXT_PATH: ${SERVER_CONTEXT_PATH:-/api/simple-rag}

      # JVM
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"

    volumes:
      - ./config:/app/config

    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      milvus:
        condition: service_started
      rustfs:
        condition: service_started
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/api/simple-rag/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - simple-rag-network

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: simple-rag-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - simple-rag-app
    networks:
      - simple-rag-network

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  milvus_minio_data:
  milvus_data:
  rustfs_data:
  rocketmq_data:
  frontend_dist:

networks:
  simple-rag-network:
    driver: bridge